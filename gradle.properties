# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# 下面是本机 JDK 17 的绝对路径；换机器构建时删掉这行或改成你自己的 JDK 17（没配的话 Gradle 会用 JAVA_HOME）
org.gradle.java.home=C\:\\Program Files\\Microsoft\\jdk-17.0.10.7-hotspot

# 本地部署（可选）：设成你的整合包 mods 目录，build 之后会把 jar 直接拷过去。
# 建议放在 ~/.gradle/gradle.properties 里，别提交到仓库。
# mods_folder=D\:\\MCJAVA\\.minecraft\\versions\\1.20.1-Forge_47.4.21\\mods

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod
mod_id=scgextra_raidplus
mod_name=SCG Extra: Raid Plus
mod_license=GNU GPLv3
mod_version=1.0.0
mod_group_id=com.scg2tlm.raidplus
mod_authors=ELMO_SYG
mod_description=Overhauls SCG Extra's wave raids.\nA raid gets a real center (the flare's landing spot) instead of following the player, waves spawn in a ring around that center, and raiders advance on the center when they have nothing to shoot at.
